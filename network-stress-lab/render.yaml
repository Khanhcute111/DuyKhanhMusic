services:
  - type: web
    name: duy-khanh-network-stress-lab
    runtime: python
    plan: free
    rootDir: network-stress-lab
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: STRESS_LAB_TOKEN
        sync: false
      - key: ALLOWED_TARGET_HOSTS
        sync: false
